name: Refresh recall data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/refresh_recalls_current.py"
      - "scripts/refresh_recalls_current_v2.py"
      - "scripts/refresh_recalls_current_v3.py"
      - "scripts/refresh_recalls_current_v4.py"
      - "scripts/finalize_source_health.py"
      - "scripts/write_source_status.py"
      - "tests/test_fda_live_augmentation.py"
      - "tests/test_fda_source_union.py"
      - "tests/test_source_health_consistency.py"
      - ".github/workflows/refresh-recalls.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: recall-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and normalize current official data
        run: |
          python3 scripts/refresh_recalls_current_v4.py
          python3 scripts/finalize_source_health.py

      - name: Write compact source-status snapshot
        run: python3 scripts/write_source_status.py

      - name: Run recall data tests
        run: |
          python3 tests/test_refresh_current.py
          python3 tests/test_refresh_recalls.py
          python3 tests/test_fda_live_augmentation.py
          python3 tests/test_fda_source_union.py
          python3 tests/test_source_health_consistency.py
          python3 tests/test_known_recall_fixtures.py

      - name: Validate all recall JSON
        run: |
          python3 -m json.tool data/recalls.json >/dev/null
          python3 -m json.tool data/source-status.json >/dev/null
          python3 -m json.tool data/demo-recalls.json >/dev/null
          python3 -m json.tool data/demo-products.json >/dev/null
          python3 -m json.tool tests/fixtures/official-recall-fixtures.json >/dev/null

      - name: Validate generated recall structure
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("data/recalls.json").read_text(encoding="utf-8"))
          snapshot = json.loads(Path("data/source-status.json").read_text(encoding="utf-8"))
          recalls = payload.get("recalls")
          health = payload.get("dataHealth", {})
          sources = health.get("sources", {})

          if not isinstance(recalls, list) or not recalls:
              raise SystemExit("Refusing to publish an empty recall dataset.")

          for agency in ("FDA", "USDA"):
              source = sources.get(agency)
              if not isinstance(source, dict):
                  raise SystemExit(f"Missing dataHealth metadata for {agency}.")
              if not source.get("checkedAt"):
                  raise SystemExit(f"Missing checkedAt for {agency}.")
              if source.get("recordCount") is None:
                  raise SystemExit(f"Missing recordCount for {agency}.")
              if "current" not in source:
                  raise SystemExit(f"Missing current quality state for {agency}.")
              if not source.get("qualityStatus"):
                  raise SystemExit(f"Missing qualityStatus for {agency}.")
              if "coverageComplete" not in source:
                  raise SystemExit(f"Missing coverageComplete for {agency}.")
              if not source.get("coverageMethod"):
                  raise SystemExit(f"Missing coverageMethod for {agency}.")

              compact = snapshot.get("sources", {}).get(agency, {})
              for key in ("success", "current", "qualityStatus", "coverageComplete", "coverageMethod", "recordCount", "newestRecallDate"):
                  if compact.get(key) != source.get(key):
                      raise SystemExit(f"source-status mismatch for {agency}.{key}")

          fda = sources.get("FDA", {})
          if fda.get("coverageMethod") != "official-fda-multi-surface-union-v1":
              raise SystemExit("FDA is not using the multi-source coverage model.")
          surfaces = fda.get("surfaces", {})
          for name in ("annualAnnouncements", "publicAlerts", "enforcement"):
              if not isinstance(surfaces.get(name), dict):
                  raise SystemExit(f"Missing FDA source surface metadata: {name}")

          usda = sources.get("USDA", {})
          if usda.get("coverageMethod") != "primary-api":
              raise SystemExit("USDA is not using the primary FSIS API coverage model.")

          agency_counts = {
              agency: sum(item.get("agency") == agency for item in recalls)
              for agency in ("FDA", "USDA")
          }
          for agency, count in agency_counts.items():
              if count == 0:
                  raise SystemExit(f"Refusing to publish zero {agency} records.")

          print("Recall dataset structure is valid:", agency_counts)
          print("Compact source status agrees with recalls.json.")
          PY

      - name: Commit changed data
        run: |
          if git diff --quiet -- data/recalls.json data/source-status.json; then
            echo "Recall data and source status are unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/recalls.json data/source-status.json
            git commit -m "chore: refresh recall data"
            git push
          fi

      - name: Report source data quality
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path

          payload = json.loads(Path("data/source-status.json").read_text(encoding="utf-8"))
          sources = payload.get("sources", {})
          now = dt.datetime.now(dt.timezone.utc)
          failures = []
          warnings = []

          def parse_time(value):
              if not value:
                  return None
              text = str(value).strip()
              if text.endswith("Z"):
                  text = text[:-1] + "+00:00"
              parsed = dt.datetime.fromisoformat(text)
              if parsed.tzinfo is None:
                  parsed = parsed.replace(tzinfo=dt.timezone.utc)
              return parsed.astimezone(dt.timezone.utc)

          for agency in ("FDA", "USDA"):
              source = sources.get(agency, {})
              successful = source.get("success") is True
              current = source.get("current") is True
              quality = source.get("qualityStatus")
              last_success = parse_time(source.get("lastSuccessfulUpdate"))
              checked = source.get("checkedAt")
              newest = source.get("newestRecallDate")

              print(
                  f"{agency}: success={successful}, current={current}, qualityStatus={quality}, "
                  f"lastSuccessfulUpdate={source.get('lastSuccessfulUpdate')}, checkedAt={checked}, "
                  f"newestRecallDate={newest}"
              )

              if not successful:
                  failures.append(f"{agency} latest official-source retrieval failed")

              if successful and not current:
                  detail = f"{agency} coverage is {quality or 'unknown'}"
                  failed_surfaces = [
                      name for name, status in (source.get("surfaces") or {}).items()
                      if status.get("success") is not True
                  ]
                  if failed_surfaces:
                      detail += f" (failed surfaces: {', '.join(failed_surfaces)})"
                  warnings.append(detail)

              if last_success is None:
                  failures.append(f"{agency} has no lastSuccessfulUpdate")
              else:
                  age = now - last_success
                  if age > dt.timedelta(hours=12):
                      failures.append(
                          f"{agency} last successful update is {age.total_seconds() / 3600:.1f} hours old"
                      )

          for warning in warnings:
              print(f"::warning::{warning}")

          if failures:
              raise SystemExit("; ".join(failures))

          if warnings:
              print("Recall data refresh completed with coverage warnings. Published metadata will warn consumers.")
          else:
              print("FDA multi-source coverage and USDA retrieval checks passed.")
          PY

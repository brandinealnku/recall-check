name: Recall data freshness watchdog

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/check_source_freshness.py"
      - "scripts/refresh_recalls_current_v4.py"
      - "scripts/write_source_status.py"
      - ".github/workflows/data-freshness-watchdog.yml"
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: recall-data-refresh
  cancel-in-progress: false

jobs:
  check-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check published FDA/USDA source freshness
        id: freshness
        continue-on-error: true
        run: python3 scripts/check_source_freshness.py --max-age-hours 8

      - name: Refresh official FDA/USDA data directly when stale
        if: steps.freshness.outcome == 'failure'
        run: |
          python3 scripts/refresh_recalls_current_v4.py
          python3 scripts/write_source_status.py

      - name: Validate refreshed recall data
        if: steps.freshness.outcome == 'failure'
        run: |
          # Validate against the current v4 multi-surface FDA/USDA contract.
          # test_source_quality.py intentionally exercises the retired v2
          # single-authority-date model and must not gate v4 production data.
          python3 tests/test_refresh_current.py
          python3 tests/test_refresh_recalls.py
          python3 tests/test_fda_live_augmentation.py
          python3 tests/test_fda_source_union.py
          python3 tests/test_known_recall_fixtures.py
          python3 -m json.tool data/recalls.json >/dev/null
          python3 -m json.tool data/source-status.json >/dev/null
          python3 scripts/check_source_freshness.py --max-age-hours 1

      - name: Commit repaired data
        if: steps.freshness.outcome == 'failure'
        run: |
          if git diff --quiet -- data/recalls.json data/source-status.json; then
            echo "Refresh completed but produced no file changes."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recalls.json data/source-status.json
          git commit -m "chore: refresh recall data"
          git push origin HEAD:main

      - name: Confirm source snapshot is fresh
        run: python3 scripts/check_source_freshness.py --max-age-hours 8

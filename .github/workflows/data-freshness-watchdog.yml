name: Recall data freshness watchdog

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/check_source_freshness.py"
      - "scripts/refresh_recalls_current_v4.py"
      - "scripts/finalize_source_health.py"
      - "scripts/write_source_status.py"
      - ".github/workflows/data-freshness-watchdog.yml"
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: recall-data-refresh
  cancel-in-progress: false

jobs:
  check-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check published FDA/USDA source freshness
        id: freshness
        continue-on-error: true
        run: python3 scripts/check_source_freshness.py --max-age-hours 8

      - name: Decide whether canonical data must be regenerated
        id: repair
        run: |
          if [ "${{ steps.freshness.outcome }}" = "failure" ] || [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh official FDA/USDA data directly when needed
        if: steps.repair.outputs.needed == 'true'
        run: |
          python3 scripts/refresh_recalls_current_v4.py
          python3 scripts/finalize_source_health.py
          python3 scripts/write_source_status.py

      - name: Validate refreshed recall data
        if: steps.repair.outputs.needed == 'true'
        run: |
          python3 tests/test_refresh_current.py
          python3 tests/test_refresh_recalls.py
          python3 tests/test_fda_live_augmentation.py
          python3 tests/test_fda_source_union.py
          python3 tests/test_source_health_consistency.py
          python3 tests/test_known_recall_fixtures.py
          python3 -m json.tool data/recalls.json >/dev/null
          python3 -m json.tool data/source-status.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          recalls = json.loads(Path('data/recalls.json').read_text())
          status = json.loads(Path('data/source-status.json').read_text())
          for agency in ('FDA', 'USDA'):
              canonical = recalls.get('dataHealth', {}).get('sources', {}).get(agency, {})
              compact = status.get('sources', {}).get(agency, {})
              for key in ('success', 'current', 'qualityStatus', 'coverageComplete', 'coverageMethod', 'recordCount', 'newestRecallDate'):
                  if compact.get(key) != canonical.get(key):
                      raise SystemExit(f'source-health mismatch: {agency}.{key}')
          print('recalls.json and source-status.json source health agree')
          PY
          python3 scripts/check_source_freshness.py --max-age-hours 1

      - name: Commit repaired data
        if: steps.repair.outputs.needed == 'true'
        run: |
          if git diff --quiet -- data/recalls.json data/source-status.json; then
            echo "Refresh completed and canonical data is unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/recalls.json data/source-status.json
            git commit -m "chore: refresh recall data"
            git push origin HEAD:main
          fi

      - name: Confirm source snapshot is fresh
        run: python3 scripts/check_source_freshness.py --max-age-hours 8

name: Apply freshness asset cache-bust

on:
  push:
    branches:
      - fix/freshness-asset-cache-bust
    paths:
      - .github/workflows/apply-freshness-asset-cache-bust.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/freshness-asset-cache-bust
      - name: Patch asset URL and regression contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          old = 'freshness.js?v=3.3.1-coverage'
          new = 'freshness.js?v=3.3.2-canonical'
          if old not in text:
              raise SystemExit(f'Expected old asset URL not found: {old}')
          index.write_text(text.replace(old, new, 1))

          test = Path('tests/test_safety_design.py')
          t = test.read_text()
          old_assert = "self.assertIn('freshness.js?v=3.3.1-coverage', INDEX)"
          new_assert = "self.assertIn('freshness.js?v=3.3.2-canonical', INDEX)\n        self.assertNotIn('freshness.js?v=3.3.1-coverage', INDEX)"
          if old_assert not in t:
              raise SystemExit('Expected freshness asset regression assertion not found')
          test.write_text(t.replace(old_assert, new_assert, 1))
          PY
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/apply-freshness-asset-cache-bust.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/test_safety_design.py .github/workflows/apply-freshness-asset-cache-bust.yml
          git commit -m "Load canonical freshness runtime with new cache key"
          git push origin HEAD:fix/freshness-asset-cache-bust

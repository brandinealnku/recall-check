name: Test RecallCheck site

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  site-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run RecallCheck 1.0 regression suite
        run: |
          python3 tests/test_safety_design.py
          python3 tests/test_fda_source_union.py
          python3 tests/test_fda_live_augmentation.py
          python3 tests/test_known_recall_fixtures.py
          python3 tests/test_refresh_current.py
          python3 tests/test_refresh_recalls.py
          python3 tests/test_source_quality.py
          python3 tests/test_source_freshness_watchdog.py
          python3 tests/test_v411_mobile_lookup.py
          python3 tests/test_release_candidate_1_0.py
          python3 tests/test_safari_private_compat.py
          python3 tests/test_pwa_share.py
          python3 tests/test_service_worker_data_passthrough.py
          python3 tests/test_production_asset_bundle.py
          python3 tests/test_production_asset_loader_contract.py
      - name: Build and validate deploy-safe production assets
        run: python3 scripts/build_production_assets.py

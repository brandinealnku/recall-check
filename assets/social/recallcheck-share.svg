<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">RecallCheck by ITSBAD Labs</title><desc id="d">Check packaged food against available FDA and USDA recall information.</desc><rect width="1200" height="630" fill="#07111F"/><rect x="0" y="0" width="1200" height="12" fill="#FF66C4"/><g transform="translate(90 150)"><rect width="250" height="250" rx="58" fill="#0A1630" stroke="#3A4964" stroke-width="2"/><g fill="#F4F7FF"><rect x="52" y="52" width="14" height="146" rx="5"/><rect x="79" y="52" width="8" height="146" rx="4"/><rect x="101" y="52" width="20" height="146" rx="6"/><rect x="135" y="52" width="10" height="146" rx="4"/><rect x="160" y="52" width="16" height="146" rx="5"/></g><rect x="193" y="52" width="14" height="146" rx="5" fill="#FF66C4"/></g><text x="405" y="235" font-family="Inter,Arial,sans-serif" font-size="78" font-weight="800" letter-spacing="-3" fill="#F4F7FF">RecallCheck</text><text x="410" y="296" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="3" fill="#FF66C4">BY ITSBAD LABS</text><text x="410" y="382" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="600" fill="#F4F7FF">Is this food recalled?</text><text x="410" y="438" font-family="Inter,Arial,sans-serif" font-size="27" fill="#B3BFD8">Compare a package with available FDA + USDA FSIS recall records.</text><text x="90" y="555" font-family="Inter,Arial,sans-serif" font-size="23" fill="#B3BFD8">Independent recall-checking tool · Official notices remain authoritative</text></svg>